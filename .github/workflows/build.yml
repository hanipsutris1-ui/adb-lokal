name: Bangun APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pasang kunci tanda tangan dari secret
        env:
          KS_B64: ${{ secrets.ADBLOKAL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ADBLOKAL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Salah satu secret belum diisi di Settings > Secrets and variables > Actions"; exit 1; fi
          A=$(printf '%s' "$KS_B64" | grep -o '/u3+7QAAAAIAAAAB[A-Za-z0-9+/=]*' | head -1 | cut -c1-2840)
          B=$(printf '%s' "$KS_PASS" | grep -o '/u3+7QAAAAIAAAAB[A-Za-z0-9+/=]*' | head -1 | cut -c1-2840)
          echo "Diagnosis: panjang secret B64=${#KS_B64}, secret PASSWORD=${#KS_PASS}; pola keystore di B64=${#A}, di PASSWORD=${#B} (utuh = 2840)"
          if [ "${#A}" -eq 2840 ]; then SRC="$A"; PASS="$KS_PASS";
          elif [ "${#B}" -eq 2840 ]; then SRC="$B"; PASS="$KS_B64"; echo "Kedua secret tertukar — dipulihkan otomatis";
          else echo "::error::Keystore tidak ditemukan utuh di kedua secret — lihat baris Diagnosis di log langkah ini"; exit 1; fi
          printf '%s' "$SRC" | base64 -d > app/adblokal-release.jks
          ls -l app/adblokal-release.jks
          keytool -list -keystore app/adblokal-release.jks -storepass "$PASS" -alias adblokal > /dev/null || { echo "::error::Keystore tidak cocok dengan kata sandi pendampingnya"; exit 1; }
          echo "ADBLOKAL_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "Keystore terverifikasi"

      - name: Bangun APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Catatan rilis dari semua commit sejak rilis sebelumnya
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          git log --reverse --pretty=format:'• %s%n%b%n' ${PREV:+$PREV..}HEAD \
            | grep -v -E '^(Co-Authored-By|Claude-Session):' | cat -s > catatan.txt
          cat catatan.txt

      - name: Beri nama APK
        run: cp app/build/outputs/apk/release/app-release.apk ADBLokal-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ADBLokal-${{ github.run_number }}
          path: ADBLokal-*.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ADB Lokal ${{ github.run_number }}
          body_path: catatan.txt
          files: ADBLokal-*.apk
