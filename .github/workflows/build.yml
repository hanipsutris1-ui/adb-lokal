name: Bangun APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pasang kunci tanda tangan
        env:
          KS_PASS: ${{ secrets.ADBLOKAL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Secret ADBLOKAL_KEYSTORE_PASSWORD belum diisi di Settings > Secrets and variables > Actions"; exit 1; fi
          B64=$(tr -d '[:space:]' < keystore.b64.txt)
          echo "Panjang base64 keystore dari repo: ${#B64} (utuh = 2840)"
          if [ "${#B64}" -ne 2840 ]; then echo "::error::Berkas keystore.b64.txt di repo tidak utuh"; exit 1; fi
          printf '%s' "$B64" | base64 -d > app/adblokal-release.jks
          ls -l app/adblokal-release.jks
          keytool -list -keystore app/adblokal-release.jks -storepass "$KS_PASS" -alias adblokal > /dev/null || { echo "::error::Keystore di repo tidak cocok dengan kata sandi secret"; exit 1; }
          echo "ADBLOKAL_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "Keystore terverifikasi"

      - name: Bangun APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Catatan rilis dari semua commit sejak rilis sebelumnya
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          git log --reverse --pretty=format:'• %s%n%b%n' ${PREV:+$PREV..}HEAD \
            | grep -v -E '^(Co-Authored-By|Claude-Session):' | cat -s > catatan.txt
          cat catatan.txt

      - name: Beri nama APK
        run: cp app/build/outputs/apk/release/app-release.apk ADBLokal-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ADBLokal-${{ github.run_number }}
          path: ADBLokal-*.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ADB Lokal ${{ github.run_number }}
          body_path: catatan.txt
          files: ADBLokal-*.apk
